name: CI and manual deploy
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      stage:
        description: Deployment stage
        type: choice
        required: true
        options: [dev, prod]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_quality.py tests/test_ingest.py -x -q
      - run: npm run synth -- -c stage=dev

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      - run: npx cdk deploy DataLakeQuality-${{ inputs.stage }} -c stage=${{ inputs.stage }} --require-approval never
